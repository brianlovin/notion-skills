name: Test

# Runs build + the full test suite on every PR and on every push to a
# non-main branch. Pair with branch protection ("Require status checks
# to pass before merging" → check `Test`) to block merges on red CI.

on:
  pull_request:
  push:
    branches-ignore:
      - main      # main is covered by release.yml; no need to double-run

concurrency:
  # Cancel in-progress runs when a new commit arrives on the same branch.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-actions:
    # Every `uses:` must be a full commit SHA; tags/branches can be re-pointed
    # at malicious code. No install or secrets needed.
    name: Actions pinned to SHAs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check pinned actions
        run: node scripts/check-pinned-actions.mjs

  test:
    name: Build + test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: ["18", "20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: node --test test/*.test.mjs
